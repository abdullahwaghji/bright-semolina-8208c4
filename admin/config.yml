backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blogs"
    label: "Blogs & Articles"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured / Grid Image", name: "image", widget: "image", hint: "Yeh image blog.html ke grid card aur article ke top par show hogi."}
      - {label: "Short Excerpt / Summary", name: "excerpt", widget: "text"}
      - {label: "Body Content (Markdown & Extra Images)", name: "body", widget: "markdown", hint: "Aap yahan text ke sath sath aur bhi images insert kar sakte hain."}
      - name: "pages"
    label: "Website Pages"
    files:
      - name: "home"
        label: "Homepage Settings"
        file: "content/home.json"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - {label: "Hero Banner Image", name: "hero_image", widget: "image"}
          - {label: "Announcement Text", name: "announcement", widget: "string"}