<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Blog Article | Online Quran Ilm Academy</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#013977',
            brandLilac: '#D6C7F0',
            brandLilacLight: '#F3EFFF',
            brandGold: '#D8A43E',
          }
        }
      }
    };
  </script>
  <!-- Markdown parser library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-brandLilacLight font-sans text-brandBlue antialiased">

  <!-- Header Section -->
  <header class="bg-white border-b border-brandLilac/40 shadow-sm py-4 px-6 flex justify-between items-center">
    <a href="index.html" class="font-bold text-brandBlue text-lg">Online Quran Ilm Academy</a>
    <a href="blog.html" class="text-sm font-semibold text-brandBlue hover:text-brandGold transition">← Back to Blogs</a>
  </header>

  <!-- Article Container -->
  <main class="max-w-4xl mx-auto px-4 py-12">
    <div id="article-container" class="bg-white rounded-3xl p-8 sm:p-12 shadow-lg border border-brandLilac/50 space-y-6">
      <!-- Loading state -->
      <div id="loading" class="text-center py-12 text-gray-500 font-medium">Loading article...</div>
    </div>
  </main>

  <!-- Script to load Markdown based on URL slug -->
  <script>
    async function fetchPost() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');
      const container = document.getElementById('article-container');

      if (!slug) {
        container.innerHTML = `<h1 class="text-2xl font-bold text-red-600">Article not found.</h1><p class="text-gray-600 mt-2">No slug provided in URL.</p>`;
        return;
      }

      try {
        // Fetching markdown file from _posts folder
        const response = await window.fetch(`_posts/${slug}.md`);
        if (!response.ok) throw new Error("Post not found");
        
        const markdownText = await response.text();

        // Simple Frontmatter parser for Markdown (Extracts Title, Date, Image, Body)
        const parts = markdownText.split('---');
        let title = "Blog Post";
        let date = "";
        let image = "";
        let bodyMarkdown = markdownText;

        if (parts.length >= 3) {
          const frontmatter = parts[1];
          bodyMarkdown = parts.slice(2).join('---');

          // Extract title
          const titleMatch = frontmatter.match(/title:\s*"?(.*?)"?$/m);
          if (titleMatch) title = titleMatch[1];

          // Extract date
          const dateMatch = frontmatter.match(/date:\s*(.*?)$/m);
          if (dateMatch) date = dateMatch[1];

          // Extract image
          const imageMatch = frontmatter.match(/image:\s*(.*?)$/m);
          if (imageMatch) image = imageMatch[1];
        }

        // Update page title
        document.getElementById('page-title').innerText = `${title} | Online Quran Ilm Academy`;

        // Render HTML content
        container.innerHTML = `
          <div class="space-y-4">
            ${date ? `<span class="text-xs font-semibold text-gray-400"><i class="fa-regular fa-calendar text-brandGold"></i> ${date}</span>` : ''}
            <h1 class="text-3xl sm:text-4xl font-extrabold text-brandBlue leading-tight">${title}</h1>
          </div>
          ${image ? `<img src="${image}" alt="${title}" class="w-full h-auto rounded-2xl shadow-md max-h-[400px] object-cover">` : ''}
          <div class="prose max-w-none text-gray-700 leading-relaxed space-y-4 pt-4">
            ${marked.parse(bodyMarkdown)}
          </div>
        `;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<h1 class="text-2xl font-bold text-red-600">Error</h1><p class="text-gray-600 mt-2">Could not load the article.</p>`;
      }
    }

    fetchPost();
  </script>
</body>
</html>
